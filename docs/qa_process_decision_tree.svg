<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="100%" height="100%" style="background-color: #090D16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="bg-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <rect x="40" y="25" width="1120" height="75" rx="14" fill="url(#bg-box)" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="60" fill="#FFFFFF" font-size="20" font-weight="700">Tizimning Umumiy Qarorlar va Xatolarni Qayta Ishlash Jarayoni (Decision &amp; Triage Flow)</text>
  <text x="70" y="82" fill="#94A3B8" font-size="13">"Xato bo'lsa nima qilinadi? Noto'g'ri ishlasa nima qilinadi? Qulay bo'lmasa qanday yechiladi?"</text>

  <!-- ==================== TRIGGER (TOP CENTER) ==================== -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="300" height="65" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <text x="150" y="28" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">HARAKAT / SO'ROV BOSHLANDI</text>
    <text x="150" y="48" fill="#94A3B8" font-size="11" text-anchor="middle">(Web, Telegram Bot yoki Scraper amali)</text>
  </g>

  <!-- Central Splitter Lines -->
  <path d="M 600 195 L 600 235" stroke="#64748B" stroke-width="2" />
  <path d="M 180 235 L 1020 235" stroke="#64748B" stroke-width="2" />

  <!-- Downward Connectors to Columns -->
  <line x1="180" y1="235" x2="180" y2="270" stroke="#10B981" stroke-width="2" marker-end="url(#m-green)" />
  <line x1="460" y1="235" x2="460" y2="270" stroke="#EF4444" stroke-width="2" marker-end="url(#m-red)" />
  <line x1="740" y1="235" x2="740" y2="270" stroke="#F59E0B" stroke-width="2" marker-end="url(#m-amber)" />
  <line x1="1020" y1="235" x2="1020" y2="270" stroke="#38BDF8" stroke-width="2" marker-end="url(#m-blue)" />

  <!-- ==================== 1-USTUN: TO'G'RI VA QULAY (HAPPY PATH) ==================== -->
  <g transform="translate(50, 275)">
    <!-- Column Header -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
    <text x="130" y="25" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">🟢 TO'G'RI VA QULAY</text>
    <text x="130" y="40" fill="#A7F3D0" font-size="10.5" text-anchor="middle">Happy Path (Ideal holat)</text>

    <!-- Step 1 -->
    <rect x="10" y="75" width="240" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="25" y="98" fill="#34D399" font-size="12" font-weight="700">1. Tezkor Munosabat</text>
    <text x="25" y="118" fill="#CBD5E1" font-size="11">• API javobi: &lt; 200ms</text>
    <text x="25" y="134" fill="#CBD5E1" font-size="11">• Bot javobi: &lt; 500ms</text>
    <text x="25" y="150" fill="#94A3B8" font-size="10.5">• Redis keshidan tez qaytarish</text>

    <line x1="130" y1="165" x2="130" y2="195" stroke="#10B981" stroke-width="1.5" marker-end="url(#m-green)" />

    <!-- Step 2 -->
    <rect x="10" y="200" width="240" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="25" y="223" fill="#34D399" font-size="12" font-weight="700">2. Ma'lumot Butunligi</text>
    <text x="25" y="243" fill="#CBD5E1" font-size="11">• Tranzaksiya to'liq saqlanadi</text>
    <text x="25" y="259" fill="#CBD5E1" font-size="11">• Tarix DB da qayd etiladi</text>
    <text x="25" y="275" fill="#94A3B8" font-size="10.5">• Hech qanday ma'lumot yo'qolmaydi</text>

    <line x1="130" y1="290" x2="130" y2="320" stroke="#10B981" stroke-width="1.5" marker-end="url(#m-green)" />

    <!-- Step 3 -->
    <rect x="10" y="325" width="240" height="100" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="25" y="348" fill="#34D399" font-size="12" font-weight="700">3. Vizual Feedback</text>
    <text x="25" y="368" fill="#CBD5E1" font-size="11">• Toast xabari ("Saqlandi")</text>
    <text x="25" y="384" fill="#CBD5E1" font-size="11">• Optimistic UI yangilanishi</text>
    <text x="25" y="400" fill="#94A3B8" font-size="10.5">• Foydalanuvchi kutib qolmaydi</text>

    <!-- Bottom Result -->
    <rect x="10" y="700" width="240" height="60" rx="8" fill="#022C22" stroke="#10B981" stroke-width="1.5" />
    <text x="130" y="726" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">NATIJA: 100% SUCCESS</text>
    <text x="130" y="744" fill="#A7F3D0" font-size="10.5" text-anchor="middle">Foydalanuvchi xursand, release yashil</text>
  </g>

  <!-- ==================== 2-USTUN: XATO BO'LSA (CRASH / FAILURE) ==================== -->
  <g transform="translate(330, 275)">
    <!-- Column Header -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
    <text x="130" y="25" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">🔴 XATO BO'LSA (FAILURE)</text>
    <text x="130" y="40" fill="#FECACA" font-size="10.5" text-anchor="middle">Texnik uzilish / Crash / Timeout</text>

    <!-- Step 1: Tarmoq uzilsa -->
    <rect x="10" y="75" width="240" height="110" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1" />
    <text x="25" y="98" fill="#EF4444" font-size="12" font-weight="700">A. Tarmoq / API Uzilsa</text>
    <text x="25" y="118" fill="#FCA5A5" font-size="11">• 500 xato darhol ko'rsatilmaydi!</text>
    <text x="25" y="134" fill="#CBD5E1" font-size="11">• 3 marta qayta urinish (Backoff)</text>
    <text x="25" y="150" fill="#CBD5E1" font-size="11">• 1s -> 2s -> 4s pauza bilan</text>
    <text x="25" y="166" fill="#94A3B8" font-size="10.5">• Agar o'tmasa: Degraded Mode</text>

    <line x1="130" y1="185" x2="130" y2="215" stroke="#EF4444" stroke-width="1.5" marker-end="url(#m-red)" />

    <!-- Step 2: Baza / Redis o'chsa -->
    <rect x="10" y="220" width="240" height="110" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1" />
    <text x="25" y="243" fill="#EF4444" font-size="12" font-weight="700">B. Redis / Baza Qulasa</text>
    <text x="25" y="263" fill="#FCA5A5" font-size="11">• Tizim butunlay yiqilmaydi!</text>
    <text x="25" y="279" fill="#CBD5E1" font-size="11">• DB to'g'ridan-to'g'ri o'qishga o'tadi</text>
    <text x="25" y="295" fill="#CBD5E1" font-size="11">• Bot keshsiz davom etadi</text>
    <text x="25" y="311" fill="#94A3B8" font-size="10.5">• Logga CRITICAL alert ketadi</text>

    <line x1="130" y1="330" x2="130" y2="360" stroke="#EF4444" stroke-width="1.5" marker-end="url(#m-red)" />

    <!-- Step 3: Telegram 429 FloodWait -->
    <rect x="10" y="365" width="240" height="110" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1" />
    <text x="25" y="388" fill="#EF4444" font-size="12" font-weight="700">C. Telegram 429 FloodWait</text>
    <text x="25" y="408" fill="#FCA5A5" font-size="11">• Bot crash bo'lmaydi!</text>
    <text x="25" y="424" fill="#CBD5E1" font-size="11">• retry_after (masalan 45s) kutiladi</text>
    <text x="25" y="440" fill="#CBD5E1" font-size="11">• sleep tugagach navbat davom etadi</text>
    <text x="25" y="456" fill="#94A3B8" font-size="10.5">• Xabarnoma to'xtab qolmaydi</text>

    <!-- Bottom Result -->
    <rect x="10" y="700" width="240" height="60" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
    <text x="130" y="726" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="middle">YECHIM: ZERO DOWNTIME</text>
    <text x="130" y="744" fill="#FECACA" font-size="10.5" text-anchor="middle">Avtomatik o'zini davolash (Self-healing)</text>
  </g>

  <!-- ==================== 3-USTUN: NOTO'G'RI ISHLASA (LOGIC BUG) ==================== -->
  <g transform="translate(610, 275)">
    <!-- Column Header -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#451A03" stroke="#F59E0B" stroke-width="1.5" />
    <text x="130" y="25" fill="#FDE68A" font-size="13" font-weight="700" text-anchor="middle">🟡 NOTO'G'RI ISHLASA (BUG)</text>
    <text x="130" y="40" fill="#FEF08A" font-size="10.5" text-anchor="middle">Mantiqiy xato / Buzilish / Desinxron</text>

    <!-- Bug 1: Desinxronizatsiya -->
    <rect x="10" y="75" width="240" height="110" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="25" y="98" fill="#FBBF24" font-size="12" font-weight="700">A. Tarix / Kesh Desinxroni</text>
    <text x="25" y="118" fill="#FDE68A" font-size="11">• Botda o'chdi, saytda qolib ketdi?</text>
    <text x="25" y="134" fill="#CBD5E1" font-size="11">• Qoida: Server-Truth ustunligi!</text>
    <text x="25" y="150" fill="#CBD5E1" font-size="11">• Server bo'sh bo'lsa, brauzer</text>
    <text x="25" y="166" fill="#94A3B8" font-size="10.5">• localStorage ni darhol tozalaydi</text>

    <line x1="130" y1="185" x2="130" y2="215" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#m-amber)" />

    <!-- Bug 2: Banned user sizib kirsa -->
    <rect x="10" y="220" width="240" height="110" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="25" y="243" fill="#FBBF24" font-size="12" font-weight="700">B. Banned User Kirsachi?</text>
    <text x="25" y="263" fill="#FDE68A" font-size="11">• JWT faqat tokenni o'qimasin!</text>
    <text x="25" y="279" fill="#CBD5E1" font-size="11">• Har so'rovda DB is_banned tekshirilsin</text>
    <text x="25" y="295" fill="#CBD5E1" font-size="11">• Banned bo'lsa darhol 403 Forbidden</text>
    <text x="25" y="311" fill="#94A3B8" font-size="10.5">• Sessiya zudlik bilan yo'q qilinadi</text>

    <line x1="130" y1="330" x2="130" y2="360" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#m-amber)" />

    <!-- Bug 3: Scraper dublikat yozsa -->
    <rect x="10" y="365" width="240" height="110" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="25" y="388" fill="#FBBF24" font-size="12" font-weight="700">C. Scraper Dublikat Tashlasa?</text>
    <text x="25" y="408" fill="#FDE68A" font-size="11">• Bazada UNIQUE(source, source_id)</text>
    <text x="25" y="424" fill="#CBD5E1" font-size="11">• Ikkinchi yozuv kelsa: SKIP</text>
    <text x="25" y="440" fill="#CBD5E1" font-size="11">• Faqat yangilangan qismlar yangilanadi</text>
    <text x="25" y="456" fill="#94A3B8" font-size="10.5">• Bazada axlat to'planmaydi</text>

    <!-- Bottom Result -->
    <rect x="10" y="700" width="240" height="60" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1.5" />
    <text x="130" y="726" fill="#FDE68A" font-size="12" font-weight="700" text-anchor="middle">YECHIM: INVARIANT SAQLASH</text>
    <text x="130" y="744" fill="#FEF08A" font-size="10.5" text-anchor="middle">Mantiqiy ziddiyat darhol bartaraf etiladi</text>
  </g>

  <!-- ==================== 4-USTUN: QULAY BO'LMASA (UX FRICTION) ==================== -->
  <g transform="translate(890, 275)">
    <!-- Column Header -->
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#082F49" stroke="#38BDF8" stroke-width="1.5" />
    <text x="130" y="25" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">🔵 QULAY BO'LMASA (UX)</text>
    <text x="130" y="40" fill="#BAE6FD" font-size="10.5" text-anchor="middle">Noqulaylik / Kutish / Adashish</text>

    <!-- UX 1: Sekin internet / Buffering -->
    <rect x="10" y="75" width="240" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="25" y="98" fill="#38BDF8" font-size="12" font-weight="700">A. Video Qotib Qolsa?</text>
    <text x="25" y="118" fill="#BAE6FD" font-size="11">• Qora ekran qolib ketmasin!</text>
    <text x="25" y="134" fill="#CBD5E1" font-size="11">• Aniq spinner va % ko'rsatilsin</text>
    <text x="25" y="150" fill="#CBD5E1" font-size="11">• Sifat avtomatik 480p ga tushirilsin</text>
    <text x="25" y="166" fill="#94A3B8" font-size="10.5">• "Serverni almashtirish" taklif qilinsin</text>

    <line x1="130" y1="185" x2="130" y2="215" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#m-blue)" />

    <!-- UX 2: Qidiruvda xato yozilsa -->
    <rect x="10" y="220" width="240" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="25" y="243" fill="#38BDF8" font-size="12" font-weight="700">B. Nomini Xato Yozsachi?</text>
    <text x="25" y="263" fill="#BAE6FD" font-size="11">• "Hech narsa topilmadi" demaslik!</text>
    <text x="25" y="279" fill="#CBD5E1" font-size="11">• Fuzzy search (aka-uka == aka uka)</text>
    <text x="25" y="295" fill="#CBD5E1" font-size="11">• "Balki siz buni qidirgandirsiz?"</text>
    <text x="25" y="311" fill="#94A3B8" font-size="10.5">• Eng o'xshash 3 ta kinoni chiqarish</text>

    <line x1="130" y1="330" x2="130" y2="360" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#m-blue)" />

    <!-- UX 3: Mobil qulaylik -->
    <rect x="10" y="365" width="240" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="25" y="388" fill="#38BDF8" font-size="12" font-weight="700">C. Telefondan Foydalanish</text>
    <text x="25" y="408" fill="#BAE6FD" font-size="11">• Barmoq yetishi (Thumb-Zone)</text>
    <text x="25" y="424" fill="#CBD5E1" font-size="11">• Asosiy tugmalar pastki panelda</text>
    <text x="25" y="440" fill="#CBD5E1" font-size="11">• Tugma o'lchami kamida 44x44px</text>
    <text x="25" y="456" fill="#94A3B8" font-size="10.5">• Modal o'rniga pastki Bottom Sheet</text>

    <!-- Bottom Result -->
    <rect x="10" y="700" width="240" height="60" rx="8" fill="#082F49" stroke="#38BDF8" stroke-width="1.5" />
    <text x="130" y="726" fill="#7DD3FC" font-size="12" font-weight="700" text-anchor="middle">YECHIM: FRICTIONLESS UX</text>
    <text x="130" y="744" fill="#BAE6FD" font-size="10.5" text-anchor="middle">Asabiylashish yo'q, qulay oqim</text>
  </g>

  <!-- ==================== FOOTER INVARIANT ==================== -->
  <g transform="translate(40, 1070)">
    <rect x="0" y="0" width="1120" height="55" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="30" y="33" fill="#E50914" font-size="13" font-weight="700">ASOSIY QA MEZONI:</text>
    <text x="175" y="32" fill="#E2E8F0" font-size="12.5">Har qanday qadamda tizim "qotib qolmasligi", foydalanuvchini chalg'itmasligi va ma'lumotlarni buzmasdan xavfsiz holatga (Safe Fallback) o'tishi shart.</text>
  </g>
</svg>
