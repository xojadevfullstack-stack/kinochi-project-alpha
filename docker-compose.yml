# Root docker-compose.yml — Kinochi local development environment
# Phase 0: Postgres 16 + Redis 7 + Backend skeleton

version: "3.9"

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kinochi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kinochi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinochi}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis 7 ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kinochi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend + Bot (FastAPI + Aiogram) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "../run.py"]
    container_name: kinochi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/backend/.venv
    env_file:
      - ./backend/.env
      - ./bot/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kinochi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kinochi}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-32571063}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-fe3038cd47d8c37788a5f4bdeef00138}
      TELEGRAM_STRING_SESSION: ${TELEGRAM_STRING_SESSION:-1ApWapzMBuyF503SKFe7YvecikokTfoWvtlnlzunbRRik8mht2VtaJve7uOtwuKwQBdXkvZ_0cOn-SBVZ2jHcHJuRhdcGiVBnP_Yg0_dEVOJT6jjvVhbwepZFPTn4HkwyVqG2Z7h-HFpXRYo4HboCGLR0QCYVx8KrKVQYTK44Sxiai6atXQ7klb6tKg_Nq8S2u3x23V82J3SVM6bROoGvltvZKMZ2n9suDPUSWtg9612fCtTqsH6ohVEq-jeWUt099pWYWCBnn_yTlWiZWdhflktlGP4nD4PL52JdQDz1zUilq1B9KFsLq8DQW3jbfYzbpAzz6175F_Ve3xuD2-wsBd8--H08Is0=}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
